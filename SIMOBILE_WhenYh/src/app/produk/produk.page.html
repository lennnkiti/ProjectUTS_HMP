<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Daftar Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Pencarian Real-Time (Two-Way Binding) -->
  <ion-item class="ion-margin-bottom">
    <ion-icon name="search-outline" slot="start"></ion-icon>
    <ion-input label="Cari Barang" labelPlacement="floating" placeholder="Ketik nama produk..."
      [(ngModel)]="searchQuery">
    </ion-input>
  </ion-item>

  <!-- Grid Layout (Menampilkan 2 kolom per baris) -->
  <ion-grid>
    <ion-row *ngFor="let barisProduk of chunkArray(getFilteredProduk(), 2)">
      <ion-col *ngFor="let p of barisProduk">

        <ion-card>
          <!-- 1. Property Binding untuk Default Image jika gambar kosong -->
          <!-- 2. Route Parameter Binding untuk lempar ID saat diklik (Kita buat halamannya setelah ini) -->
          <img [src]="p.gambar === '' ? 'https://ionicframework.com/docs/img/demos/thumbnail.svg' : p.gambar" 
               routerLink="/details/{{ p.id }}" 
               style="height: 350px; object-fit: cover; width: 100%;" />

          <ion-card-header>
            <ion-card-title style="font-size: 14px;" routerLink="/details/{{ p.id }}">
              {{ p.nama }}
            </ion-card-title>
            <ion-card-subtitle>Rp {{ p.harga_jual }}</ion-card-subtitle>
          </ion-card-header>

          <ion-card-content>
            <p>Stok: {{ p.stok }}</p>

            <!-- Property Binding (disabled) & Event Binding (click) -->
            <ion-button expand="block" size="small" [disabled]="p.stok == 0" (click)="tambahKeKeranjang(p)">
              + Keranjang
            </ion-button>
          </ion-card-content>
        </ion-card>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
