<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>
      INI HOMES
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <h2>Selamat Datang, {{ namaUser }} !!</h2>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Ringkasan Hari Ini</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="full">
        <ion-item>
          <ion-icon name="cube-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h3>Total Macam Produk</h3>
            <p>{{ totalProduk }} item tersedia</p>
          </ion-label>
        </ion-item>
        
        <ion-item>
          <ion-icon name="trending-up-outline" slot="start" color="success"></ion-icon>
          <ion-label>
            <h3>Produk Terlaris</h3>
            <p>{{ produkTerlaris }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
